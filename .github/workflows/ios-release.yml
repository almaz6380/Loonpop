# iOS bauen, signieren und zu App Store Connect hochladen — auf einem macOS-
# Rechner von GitHub, ohne eigenen Mac. Vorlage: almaz6380/anigosha.
#
# Startet NUR von Hand. Hochladen steht auf aus. Einrichtung: docs/store.md.
# WICHTIG: CURRENT_PROJECT_VERSION in ios/App/App.xcodeproj/project.pbxproj vor
# jedem Upload erhoehen (2 Stellen) — Apple lehnt eine benutzte Build-Nummer ab.
# macOS-Minuten zaehlen bei GitHub zehnfach; ein Lauf dauert ~15 min.
name: iOS Release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Wirklich zu App Store Connect hochladen? (aus = nur bauen)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # Apple verlangt seit 2026 das iOS-26-SDK (sonst Fehler 90725).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhaengigkeiten
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build-Nummer anzeigen
        run: |
          B=$(grep -m1 CURRENT_PROJECT_VERSION ios/App/App.xcodeproj/project.pbxproj | tr -dc '0-9')
          V=$(grep -m1 MARKETING_VERSION ios/App/App.xcodeproj/project.pbxproj | cut -d'=' -f2 | tr -d ' ;')
          echo "Version $V · Build $B"
          echo "B=$B" >> "$GITHUB_ENV"
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Web-Bundle + Capacitor-Sync
        run: |
          npm run build
          npx cap sync ios

      - name: Signierung einrichten
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # Ohne Secret holt der Lauf das Profil selbst bei Apple
          # (scripts/profil-holen.py) — es muss dann nur im Developer-Konto
          # unter genau diesem Namen existieren.
          if [ -z "${PROFILE_B64:-}" ]; then
            python3 -m venv "$RUNNER_TEMP/venv"
            "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
            ASC_KEY_P8="$(printf '%s' "$ASC_KEY_P8_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d)" \
              "$RUNNER_TEMP/venv/bin/python" scripts/profil-holen.py "loonpop AppStore" "$RUNNER_TEMP/profil.mobileprovision"
            PROFILE_B64="$(base64 < "$RUNNER_TEMP/profil.mobileprovision" | tr -d '\n')"
            rm -f "$RUNNER_TEMP/profil.mobileprovision"
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$CERT_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$PROFILE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/loonpop-ci.mobileprovision
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: ExportOptions schreiben
        run: |
          # provisioningProfiles ist bei signingStyle=manual Pflicht. Der Name
          # muss genau der des Profils im Apple-Developer-Konto sein.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOP'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>JU8STVD4SJ</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>at.gallab.loonpop</key><string>loonpop AppStore</string>
            </dict>
          </dict>
          </plist>
          EOP

      - name: Archivieren
        run: |
          cd ios/App
          # Capacitor 8 bindet Plugins ueber Swift Package Manager ein — kein
          # .xcworkspace, deshalb -project. Die Signierung steht im Projekt
          # (Release-Konfiguration), nicht hier: Kommandozeilen-Settings gaelten
          # fuer ALLE Targets, auch fuer Swift-Pakete ohne Profil.
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive

      - name: Exportieren
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"

      - name: IPA als Artefakt ablegen
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: loonpop-ios-${{ env.V }}-b${{ env.B }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Zu App Store Connect hochladen
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/asc-keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d \
            > "$API_PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Aufraeumen
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/loonpop-ci.mobileprovision
          rm -rf "$RUNNER_TEMP/asc-keys" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/export" \
                 "$RUNNER_TEMP/App.xcarchive" "$RUNNER_TEMP/ExportOptions.plist"
